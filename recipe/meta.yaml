{% set version = "0.13.2" %}
{% set name = "seaborn" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 93e60a40988f4d65e9f4885df477e2fdaff6b73a9ded434c1ab356dd57eefff7

build:
  number: 4
  skip: true  # [py<38]
  script: python -m pip install . --no-deps --ignore-installed --no-build-isolation

requirements:
  host:
    - pip
    - python
    - flit-core >=3.2,<4
  run:
    - python
    - numpy >=1.20,!=1.24.0
    - matplotlib-base >=3.4,!=3.6.1
    - pandas >=1.2
  run_constrained:
    - scipy >=1.7
    # remove this selector during the next rebuild/version bump once the win-arm64 package is available
    - statsmodels >=0.12  # [not (win and arm64)]


# E AttributeError: module 'numpy' has no attribute 'in1d', in1d atr. is depricated since NumPy 2.0 and removed since v2.4
{% set deselect_tests = " --deselect=tests/test_categorical.py::TestBoxenPlot" %}
# E       AssertionError: Regex pattern did not match.
{% set deselect_tests = deselect_tests + " --deselect=tests/_core/test_plot.py::TestPlotting::test_theme_validation" %}
# E       AssertionError: Arrays are not equal
{% set deselect_tests = deselect_tests + " --deselect=tests/test_distributions.py::TestKDEPlotBivariate::test_log_scale" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_categorical.py::TestSwarmPlot::test_log_scale" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_categorical.py::TestStripPlot::test_log_scale" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_relational.py::TestLinePlotter::test_log_scale" %}
# E       AssertionError: assert False
{% set deselect_tests = deselect_tests + " --deselect=tests/test_utils.py::test_ticklabels_overlap" %}

test:
  source_files:
    - tests
  imports:
    - seaborn
    - seaborn.colors
    - seaborn.external
    - seaborn.objects
  commands:
    - pip check
    # test uses numpy 2 depricated APIs and fails
    - "pytest tests -vv {{ deselect_tests }} -k \"not test_weights and not test_1d_row_wrapped and not test_1d_column_wrapped\""
  requires:
    - pip
    - pytest <9
    - scipy >=1.7
    # remove this selector during the next rebuild/version bump once the win-arm64 package is available
    - statsmodels >=0.12  # [not (win and arm64)]
    # Re-adding matplotlib here so qt backend is used instead of tk to avoid `cannot find tcl` error
    - matplotlib

about:
  home: https://seaborn.pydata.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.md
  summary: Statistical data visualization
  description: |
    Seaborn is a Python visualization library based on matplotlib. It
    provides a high-level interface for drawing attractive statistical graphics.
  dev_url: https://github.com/mwaskom/seaborn
  doc_url: https://seaborn.pydata.org

extra:
  recipe-maintainers:
    - msarahan
    - r-jain1
    - croth1
